---
# docker compose up -d
# docker compose up --build
# docker compose down
# docker compose down -v

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mssql
    command: /bin/bash /entrypoint.sh
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=SomeStrongPwd123
      - MSSQL_TCP_PORT=1433
      - MSSQL_ENABLE_HADR=0
      - MSSQL_BACKUP_DIR=/var/opt/mssql/backup
      - MSSQL_DATA_DIR=/var/opt/mssql/data
      - MSSQL_LOG_DIR=/var/opt/mssql/log
      - MSSQL_DUMP_DIR=/var/opt/mssql/dump
      - MSSQL_COLLATION=SQL_Latin1_General_CP1_CI_AS
      - MSSQL_MEMORY_LIMIT_MB=2048
      - MSSQL_AGENT_ENABLED=false
      - MSSQL_ENABLE_HADR=0
      - MSSQL_LCID=1033
      - MSSQL_MASTER_DATA_FILE=/var/opt/mssql/data/master.mdf
      - MSSQL_MASTER_LOG_FILE=/var/opt/mssql/data/mastlog.ldf
      - MSSQL_ERROR_LOG_FILE=/var/opt/mssql/log/errorlog
      - MSSQL_TELEMETRY_ENABLED=false
      - MSSQL_ENCRYPT=false
      - MSSQL_TRUST_SERVER_CERTIFICATE=true
      - MSSQL_ENABLE_LOGIN_LOGGING=false
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - mssqldata:/var/opt/mssql
      - ./db/mssql/docker-entrypoint.sh:/entrypoint.sh
      - ./db/mssql/docker-db-init.sh:/db-init.sh

  migrator:
    build:
      context: ./src/HappyCode.NetCoreBoilerplate.Db
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=limitkurs;User Id=sa;Password=SomeStrongPwd123;TrustServerCertificate=true;Encrypt=false;
    restart: "no"

  netcore-boilerplate:
    container_name: netcore-boilerplate
    build:
      context: .
      dockerfile: src/HappyCode.NetCoreBoilerplate.Api/Dockerfile
    ports:
      - 5001:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=limitkurs;User Id=sa;Password=SomeStrongPwd123;TrustServerCertificate=true;Encrypt=false;
    depends_on:
      - mssql
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nextjs-admin:
    container_name: nextjs-admin
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - netcore-boilerplate

volumes:
  mssqldata:
